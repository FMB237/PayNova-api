name: payment-api 

services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - redis
    volumes:
      - ./:/app
      - ./app/backups:/app/backups
    networks:
      - paynova-network

  redis:
    image: redis:latest
    container_name: redis-api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "6379:6379"
    volumes:
      - REDIS-data:/data
    networks:
      - paynova-network
   
  nginx:
    image: nginx:1.28.3-alpine
    container_name: nginx-api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - paynova-network
volumes:
  REDIS-data:

networks:
  paynova-network:
    driver: bridge


